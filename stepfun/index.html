<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地书房 · seekdb</title></head><body><main>
<header><span class="eyebrow">LOCAL KNOWLEDGE / SEEKDB</span><h1>资料留在手边，<br>答案有据可循。</h1><p>浏览器本地向量化 · 数据库混合检索</p></header>
<section class="controls"><label>知识库<input id="library" value="research" pattern="[a-z][a-z0-9_]*"></label><button id="switch">创建 / 切换</button><label>精度<select id="dtype"><option value="q8">INT8 · 推荐</option><option value="fp32">FP32 · 评测基线</option></select></label><label>后端<select id="device"><option value="auto">自动优先 WebGPU</option><option value="wasm">强制 WASM（降级测试）</option></select></label><label>批大小<select id="batch"><option>8</option><option>1</option><option>16</option></select></label><button id="load">加载本地模型</button></section>
<p id="status" role="status">尚未加载模型。请先创建知识库。</p><progress id="progress" max="100" value="0"></progress>
<div class="columns"><section><h2>01 / 收集资料</h2><p>导入 UTF-8 文本或 Markdown。文件按内容去重，支持连续追加。</p><input id="files" type="file" accept=".txt,.md" multiple><button id="import">导入并建立索引</button><p id="count">当前知识库：未选择</p><h3>可复现实验</h3><p>固定语料与查询，比较 FP32/INT8 和不同批大小。报告仅包含实际测量结果。</p><button id="benchmark">运行当前配置评测</button><button id="download">导出测量记录</button></section>
<section><h2>02 / 找到原文</h2><form id="search"><label for="query">你想查找什么？</label><textarea id="query" rows="3" placeholder="例如：How does a vector index work?"></textarea><button>混合检索</button></form><div id="results" aria-live="polite"><p class="empty">检索结果将在这里呈现，附带原文与来源。</p></div></section></div>
<footer>推理仅发生在本机浏览器。原文与向量写入你配置的 seekdb；未调用云端推理。</footer></main><script type="module" src="/src/main.js"></script></body></html>
