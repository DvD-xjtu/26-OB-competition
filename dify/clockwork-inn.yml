          ,\n    \"shadow\": \"长短不一的钟影交叠在墙上，像几条尚未写完的故事线。\",\n}\nMOTIFS = {\n    \"\
          hands\": \"那些装饰钟的指针沿逆时针方向行进，怀表则只按实际消费倒走。\",\n    \"sand\": \"装饰沙漏里的沙粒向上飘动，怀表的读数仍由时间账本决定。\"\
          ,\n    \"steam\": \"钟形壁画上的蒸汽仿佛正回到壶嘴，真实的时间收支仍记在账本里。\",\n    \"chime\": \"\
          装饰钟的报时音符倒着排列，怀表仍只随着已结算的消费转动。\",\n}\n\n\ndef render_story(plan_json: str,\
          \ turn_prompt: str, state_json: str) -> dict:\n    \"\"\"Validate an LLM\
          \ plan and render facts once for both save and display.\"\"\"\n    if not\
          \ isinstance(plan_json, str) or len(plan_json) > 2000:\n        raise ValueError(\"\
          叙事计划格式错误，本轮尚未保存，请重试。\")\n    text = plan_json.strip()\n    if text.startswith(\"\
          ```json\\n\") and text.endswith(\"\\n```\"):\n        text = text[8:-4].strip()\n\
          \    try:\n        plan = json.loads(text)\n        context = json.loads(turn_prompt)\n\
          \        state = json.loads(state_json)\n    except (ValueError, TypeError):\n\
          \        raise ValueError(\"模型未返回有效的叙事计划，本轮尚未保存，请重试。\")\n    keys = {\"\
          scene\", \"motif\", \"callback_turn\", \"next_choice\"}\n    if not isinstance(plan,\
          \ dict) or set(plan) != keys:\n        raise ValueError(\"模型计划包含未授权字段，本轮尚未保存。\"\
          )\n    if not isinstance(plan[\"scene\"], str) or plan[\"scene\"] not in\
          \ SCENES:\n        raise ValueError(\"模型场景不在允许范围，本轮尚未保存。\")\n    if not\
          \ isinstance(plan[\"motif\"], str) or plan[\"motif\"] not in MOTIFS:\n \
          \       raise ValueError(\"模型意象不在允许范围，本轮尚未保存。\")\n    if context[\"state\"\
          ] != state or context[\"rules\"][\"branch\"] == \"guide\":\n        raise\
          \ ValueError(\"叙事状态与本轮结算不一致，本轮尚未保存。\")\n    if state[\"minutes\"] != 45\
          \ + state[\"earned\"] - state[\"spent\"]:\n        raise ValueError(\"时间账本不平，本轮尚未保存。\"\
          )\n    rule = context[\"rules\"]\n    before = context[\"before\"]\n   \
          \ if (state[\"turn\"] != before[\"turn\"] + 1\n            or rule[\"minute_change\"\
          ] != state[\"minutes\"] - before[\"minutes\"]\n            or rule[\"cost\"\
          ] != state[\"spent\"] - before[\"spent\"]\n            or rule[\"income\"\
          ] != state[\"earned\"] - before[\"earned\"]):\n        raise ValueError(\"\
          叙事收支与本轮结算不一致，本轮尚未保存。\")\n    last = state[\"events\"][-1] if state[\"events\"\
          ] else None\n    bounded_outcome = rule[\"outcome\"].encode(\"utf-8\")[:600].decode(\"\
          utf-8\", errors=\"ignore\")\n    if not last or last[\"turn\"] != state[\"\
          turn\"] or last[\"outcome\"] != bounded_outcome:\n        raise ValueError(\"\
          叙事结论与本轮账页不一致，本轮尚未保存。\")\n    choices = context[\"available_choices\"]\n\
          \    choice = plan[\"next_choice\"]\n    if type(choice) is not int or not\
          \ 0 <= choice < len(choices):\n        raise ValueError(\"模型建议不在本轮可用行动中，本轮尚未保存。\"\
          )\n    past = {e[\"turn\"]: e for e in state[\"events\"] if e[\"turn\"]\
          \ < state[\"turn\"]}\n    callback = plan[\"callback_turn\"]\n    if type(callback)\
          \ is not int or (callback != 0 and callback not in past):\n        raise\
          \ ValueError(\"模型引用了不存在的前情，本轮尚未保存。\")\n    parts = [SCENES[plan[\"scene\"\
          ]] + MOTIFS[plan[\"motif\"]]]\n    if callback:\n        # Explicit past\
          \ tense: historical outcomes must never become current facts.\n        event\
          \ = past[callback]\n        quoted = json.dumps(event[\"outcome\"], ensure_ascii=False)\n\
          \        parts.append(\"翻阅第 %d 轮账页，当时的记录是：%s。那是过去的记录；现在的结果与归属以下文为准。\" %\
          \ (callback, quoted))\n    parts.append(\"本轮结算：\" + context[\"rules\"][\"\
          outcome\"])\n    parts.append(\"此刻你在%s，余额 %d 分钟，怀表 %02d:%02d。\" % (\n  \
          \      state[\"location\"], state[\"minutes\"], state[\"clock\"] // 60,\
          \ state[\"clock\"] % 60))\n    # List each memory's CURRENT ownership, overriding\
          \ even poisoned legacy prose.\n    if state[\"memories\"]:\n        owned\
          \ = [m for m in state[\"memories\"] if m[\"status\"] != \"pledged\"]\n \
          \       pledged = [m for m in state[\"memories\"] if m[\"status\"] == \"\
          pledged\"]\n        def labels(items):\n            return \"、\".join(json.dumps(m[\"\
          label\"], ensure_ascii=False) for m in items)\n        if owned:\n     \
          \       parts.append(\"现在归你持有的记忆：%s；它们不在抵押柜中，无需再付赎回费。%s\" % (\n        \
          \        labels(owned), \"本次旅程已结束。\" if state[\"closed\"] else \"今后主动回忆每次花\
          \ 2 分钟，本句不产生额外收费。\"))\n        if pledged:\n            parts.append(\"\
          现在仍抵押的记忆：%s；%s\" % (\n                labels(pledged), \"它们留在旅店，本次旅程已结束。\"\
          \ if state[\"closed\"] else \"赎回前无法回忆，可另行支付 25 分钟赎回一段。\"))\n    parts.append(\"\
          随身物品：\" + \"、\".join(state[\"inventory\"]) + \"。\")\n    if state[\"watch_name\"\
          ]:\n        parts.append(\"表盖刻字：\" + json.dumps(state[\"watch_name\"], ensure_ascii=False)\
          \ + \"。\")\n    parts.append(\"下一步可选（尚未执行）：\" + choices[choice])\n    story\
          \ = \"\\n\\n\".join(parts)\n    # Never truncate away a conclusion or ownership\
          \ clarification.\n    if len(story.encode(\"utf-8\")) > 6000:\n        raise\
          \ ValueError(\"本轮叙事超过存储容量，本轮尚未保存。\")\n    audit = {\n        \"renderer\"\
          : \"bounded-plan-v1\", \"validated\": True, \"plan\": plan,\n        \"\
          state_turn\": state[\"turn\"], \"balance\": state[\"minutes\"],\n      \
          \  \"memory_statuses\": {m[\"id\"]: m[\"status\"] for m in state[\"memories\"\
          ]},\n        \"story_sha256\": hashlib.sha256(story.encode(\"utf-8\")).hexdigest(),\n\
          \        \"model_prose_used\": False,\n    }\n    return {\"story\": story,\
          \ \"audit\": json.dumps(audit, ensure_ascii=False, sort_keys=True)}\ndef\
          \ main(player, chapter, action, story, state_json, turn_prompt):\n    rendered\
          \ = render_story(story, turn_prompt, state_json)\n    body = {\"player\"\
          : player, \"chapter\": chapter, \"action\": action.strip(),\n          \
          \  \"story\": rendered[\"story\"], \"state\": json.loads(state_json)}\n\
          \    # PowerContext adds its envelope. Bound the complete body, never truncate\
          \ prose.\n    if len(json.dumps(body, ensure_ascii=False).encode(\"utf-8\"\
          )) > 7500:\n        raise ValueError(\"存档超过容量，本轮尚未保存，请使用较短的记忆名称。\")\n  \
          \  return {\"body\": json.dumps(body, ensure_ascii=False), \"audit\": rendered[\"\
          audit\"]}"
        variables:
        - variable: player
          value_selector:
          - prepare
          - storage_player
        - variable: chapter
          value_selector:
          - prepare
          - storage_chapter
        - variable: action
          value_selector:
          - start
          - action
        - variable: story
          value_selector:
          - narrate
          - text
        - variable: state_json
          value_selector:
          - rules
          - state_json
        - variable: turn_prompt
          value_selector:
          - rules
          - turn_prompt
        outputs:
          body:
            type: string
            children: null
          audit:
            type: string
            children: null
