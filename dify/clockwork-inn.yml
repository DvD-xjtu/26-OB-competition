        code: "\"\"\"Render a native LLM's bounded scene plan against authoritative\
          \ rule facts.\n\nNo model-authored natural language is displayed or persisted.\
          \ The model selects\nimagery, a historical callback and a suggested next\
          \ action; Code renders their\nmeaning. An invalid plan fails before the\
          \ HTTP save, rather than silently\npretending that a fixed response was\
          \ a successful model run.\n\"\"\"\nimport hashlib\nimport json\n\nSCENES\
          \ = {\n    \"brass\": \"黄铜灯罩映着细密的划痕，光晕像一枚旧硬币，在桌沿缓缓转动。\",\n    \"ink\": \"\
